aid: partyslate
name: PartySlate
description: PartySlate is a Chicago-based dual marketplace and SaaS platform for the events industry,
  connecting people planning weddings, galas, corporate events, birthdays, and holiday parties with the
  leading venues, event professionals, and vendors across the country. The photo-rich platform lets
  vendors showcase their work through millions of real event photos, build networks of industry partners,
  and connect directly with prospective clients, while PartySlate Pro provides venues, planners, and
  vendors an AI-powered SaaS suite to organize, search, and share their photo portfolios with Canva
  integration and content-management tools built for events. No public developer API or documentation
  surface was found during enrichment.
